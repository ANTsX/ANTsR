# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # ubuntu-latest (26.04, GCC 15) fails building ITKR from source until
          # ANTsX/ITKR picks up ITK 4f275769e3; ubuntu-24.04 (GCC 13) builds.
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-24.04,    r: 'release'}
          - {os: macos-latest,    r: 'release'}
          # R >= 4.7 ships macOS binaries as .tar.xz, not .tgz
          - {os: macos-latest,    r: 'devel'}
          - {os: windows-latest,  r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      ITK_GLOBAL_DEFAULT_NUMBER_OF_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
      R_KEEP_PKG_SOURCE: yes
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # ANTsRCore and ITKR aren't on CRAN; install their r-universe builds,
      # which skips a ~55 min ANTs build wherever a binary exists
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://antsx.r-universe.dev

      # hdf5r needs libhdf5, and building ITKR from source (where r-universe
      # has no binary for this Ubuntu) needs cmake
      - name: Install system dependencies - LINUX
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev cmake

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install Python test dependencies
        run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r .github/requirements-ci.txt

      - name: Select Python for reticulate
        shell: Rscript {0}
        env:
          ANTSR_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          python <- normalizePath(Sys.getenv("ANTSR_TEST_PYTHON"), winslash = "/", mustWork = TRUE)
          cat("RETICULATE_PYTHON=", python, "\n", sep = "",
            file = Sys.getenv("GITHUB_ENV"), append = TRUE)

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # On Windows the tests pass but R never exits afterwards. Test whether
      # ITK's thread pool deadlocks at process shutdown by switching to the
      # Platform threader, which keeps no persistent worker threads.
      - name: Use ITK Platform threader - WINDOWS
        if: runner.os == 'Windows'
        shell: bash
        run: echo "ITK_GLOBAL_DEFAULT_THREADER=Platform" >> "$GITHUB_ENV"

      # Stream installation output: R CMD build otherwise hides it while
      # installing ANTsR before building vignettes, where Windows stalled.
      - name: Install ANTsR with live diagnostics - WINDOWS
        if: runner.os == 'Windows'
        timeout-minutes: 30
        shell: bash
        run: R CMD INSTALL --no-multiarch . 2>&1 | tee antsr-install.log

      # R CMD check's example run hangs on Windows and its buffered Rout
      # can't say where. Run each example in its own process, kill any that
      # exceeds 5 min, and report per-example timings and the stuck line.
      - name: Time examples individually - WINDOWS
        if: runner.os == 'Windows'
        timeout-minutes: 90
        continue-on-error: true
        shell: bash
        run: Rscript .github/scripts/time-examples.R 300

      # On Windows the install R CMD build does before building vignettes
      # hangs until the 6h job limit, even though the install above succeeds,
      # so skip vignettes there; other platforms still build them.
      # On Windows, ANTSR_TRACE_FILE makes ANTsR's .onLoad log every
      # completed top-level expression with a timestamp (see R/zzz.R); after
      # a hang, the expression following the last logged line is the culprit.
      # Windows examples take ~3 min, so a 45 min cap still catches the hang
      # without burning 2 hours.
      - uses: r-lib/actions/check-r-package@v2
        timeout-minutes: ${{ runner.os == 'Windows' && 45 || 120 }}
        env:
          ANTSR_TRACE_FILE: ${{ runner.os == 'Windows' && format('{0}/antsr-trace.log', github.workspace) || '' }}
        with:
          upload-snapshots: true
          build_args: ${{ runner.os == 'Windows' && 'c("--no-manual","--no-build-vignettes")' || 'c("--no-manual","--compact-vignettes=gs+qpdf")' }}
          args: ${{ runner.os == 'Windows' && 'c("--no-manual","--as-cran","--ignore-vignettes")' || 'c("--no-manual","--as-cran")' }}
          error-on: '"error"'

      # ANTsR-Ex.Rout is written as examples run, so after a timeout its last
      # lines name the example that hung. A timed-out check leaves Rterm
      # running with the file locked (upload fails with EBUSY), so stop R
      # first and also print the tail to the log.
      - name: Release and show example output - WINDOWS
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Stop-Process -Name Rterm, R, Rscript, Rcmd -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          Get-ChildItem -Path check -Recurse -Filter '*-Ex.Rout*' -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Output "::group::Tail of $($_.FullName)"
              Get-Content $_.FullName -Tail 100
              Write-Output "::endgroup::"
            }
          if (Test-Path antsr-trace.log) {
            Write-Output "::group::Tail of antsr-trace.log (last completed expressions)"
            Get-Content antsr-trace.log -Tail 60
            Write-Output "::endgroup::"
            $last = Get-Content antsr-trace.log -Tail 1
            Write-Output "Last completed expression: $last"
          }

      - name: Upload Windows installation diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installation-diagnostics
          path: |
            antsr-install.log
            antsr-trace.log
            check/**/*-Ex.R
            check/**/*-Ex.timings
            check/**/*.out
            check/**/*.log
            check/**/*.Rout
            check/**/*.Rout.fail
          if-no-files-found: ignore
